name = "kaikei-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "http://localhost:5173"
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "kaikei-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# 本番用の値は `wrangler deploy --env production` 等で切り替えるか、
# Cloudflareダッシュボード / `wrangler secret put` で上書きしてください。
# 機密情報(JWT_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET)は
# [vars] に書かず、必ず `wrangler secret put <NAME>` で設定してください。
