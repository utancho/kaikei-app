name: Desktop app release
permissions:
  contents: read

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
          - os: windows-latest
            dist-script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./desktop/package.json').version")"
          test "${GITHUB_REF_NAME}" = "desktop-v${PACKAGE_VERSION}"

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.dist-script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaikei-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # kaikei-appは非公開リポジトリのため、GitHub Releasesのダウンロードには
      # ログイン+アクセス権が必要になってしまう。ビルド済みバイナリだけを
      # 公開の配布専用リポジトリ(kaikei-releases、ソースコードは含まない)へ公開する。
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: utancho/kaikei-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.{dmg,exe}
          generate_release_notes: true
