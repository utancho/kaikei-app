name: Desktop app release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
          - os: windows-latest
            dist-script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./desktop/package.json').version")"
          test "${GITHUB_REF_NAME}" = "desktop-v${PACKAGE_VERSION}"

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.dist-script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaikei-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # kaikei-appは非公開リポジトリのため、GitHub Releasesのダウンロードには
      # ログイン+アクセス権が必要になってしまう。ビルド済みバイナリだけを
      # 公開の配布専用リポジトリ(kaikei-releases、ソースコードは含まない)へ公開する。
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: utancho/kaikei-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.{dmg,exe}
          generate_release_notes: true
