name = "kaikei-app"
main = "server/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# クライアント(client/dist)とAPIを同じWorkerからまとめて配信する。
# 同一オリジンになるので、Cookieのcross-site設定(SameSite=None等)が不要になる。
[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# この [vars] は `wrangler deploy` (本番) で使われる値。
# ローカルの `wrangler dev` では .dev.vars の同名キーが優先されるため、
# .dev.vars 側に development 用の値を書くこと(直接ここは書き換えない)。
[vars]
APP_URL = "https://kaikei-app.suzu-e97.workers.dev"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "kaikei-db"
database_id = "e7e8c115-5101-411f-9e37-c4f548948930"
migrations_dir = "server/migrations"

# 本番用の値は Cloudflareダッシュボード / `wrangler secret put` で設定してください。
# 機密情報(JWT_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET)は
# [vars] に書かず、必ず `wrangler secret put <NAME>` で設定してください。
